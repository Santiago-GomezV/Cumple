<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz cumpleaños ❤️</title>
<style>
    :root {
        --bg: #160b13;
        --text: #fff7fb;
        --soft: #ffdce9;
        --heart: #ff477e;
        --heart2: #ff7aa2;
        --gold: #ffd166;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Georgia, "Times New Roman", serif;
        background:
            radial-gradient(circle at 50% 40%, #3a1426 0%, var(--bg) 55%, #090509 100%);
        color: var(--text);
    }

    .scene {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 24px;
    }

    .stars {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    .star {
        position: absolute;
        color: #fff;
        opacity: .75;
        animation: twinkle 2.8s ease-in-out infinite;
    }

    .card {
        width: min(680px, 94vw);
        min-height: 650px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        z-index: 2;
    }

    .eyebrow {
        font-family: Arial, sans-serif;
        font-size: .85rem;
        letter-spacing: .25em;
        text-transform: uppercase;
        color: var(--soft);
        opacity: 0;
        animation: appear 1s .3s forwards;
    }

    h1 {
        margin: 10px 0 0;
        font-size: clamp(2.5rem, 9vw, 4.8rem);
        line-height: 1;
        opacity: 0;
        animation: appear 1s .8s forwards;
    }

    .heart-wrap {
        width: 190px;
        height: 190px;
        margin: 42px 0 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: appear 1s 1.1s both;
    }

    .heart {
        width: 110px;
        height: 110px;
        background: linear-gradient(135deg, var(--heart2), var(--heart));
        transform: rotate(-45deg);
        position: relative;
        filter: drop-shadow(0 0 28px rgba(255, 71, 126, .45));
        animation: beat 1.25s ease-in-out infinite;
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: inherit;
    }

    .heart::before {
        top: -55px;
        left: 0;
    }

    .heart::after {
        top: 0;
        left: 55px;
    }

    .message {
        max-width: 530px;
        font-size: clamp(1.05rem, 3vw, 1.35rem);
        line-height: 1.65;
        color: var(--soft);
        opacity: 0;
        animation: appear 1s 1.6s forwards;
    }

    .signature {
        margin-top: 24px;
        font-family: Arial, sans-serif;
        font-size: .9rem;
        letter-spacing: .12em;
        color: var(--gold);
        opacity: 0;
        animation: appear 1s 2.1s forwards;
    }

    .hint {
        position: fixed;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        font: 12px Arial, sans-serif;
        color: #d9b6c5;
        opacity: .7;
        z-index: 3;
    }

    .particle {
        position: fixed;
        pointer-events: none;
        font-size: 18px;
        animation: floatUp 1.4s ease-out forwards;
        z-index: 5;
    }

    @keyframes beat {
        0%, 100% { transform: rotate(-45deg) scale(1); }
        12% { transform: rotate(-45deg) scale(1.08); }
        24% { transform: rotate(-45deg) scale(1); }
        36% { transform: rotate(-45deg) scale(1.05); }
        52% { transform: rotate(-45deg) scale(1); }
    }

    @keyframes appear {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes twinkle {
        0%, 100% { transform: scale(.7); opacity: .25; }
        50% { transform: scale(1.25); opacity: 1; }
    }

    @keyframes floatUp {
        from {
            transform: translate(-50%, -50%) scale(.5) rotate(0deg);
            opacity: 1;
        }
        to {
            transform: translate(-50%, -180px) scale(1.2) rotate(25deg);
            opacity: 0;
        }
    }

    @media (max-width: 500px) {
        .card { min-height: 560px; }
        .heart-wrap { margin: 34px 0 26px; }
        .heart, .heart::before, .heart::after {
            width: 85px;
            height: 85px;
        }
        .heart::before { top: -42.5px; }
        .heart::after { left: 42.5px; }
    }
</style>
</head>
<body>
<div class="scene" id="scene">
    <div class="stars" id="stars"></div>

    <main class="card">
        <div class="eyebrow">Hoy es un día especial</div>
        <h1>¡Feliz cumpleaños! 🎂</h1>

        <div class="heart-wrap" id="heartWrap">
            <div class="heart"></div>
        </div>

        <div class="message">
            Espero que este nuevo año venga lleno de momentos bonitos,
            risas y muchas razones para sonreír, tqm Andre. ❤️
        </div>

        <div class="signature">Con cariño ✨</div>
    </main>

    <div class="hint">Toca la pantalla ✨</div>
</div>

<script>
    const stars = document.getElementById("stars");
    const scene = document.getElementById("scene");

    for (let i = 0; i < 34; i++) {
        const star = document.createElement("span");
        star.className = "star";
        star.textContent = Math.random() > 0.65 ? "✦" : "·";
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.fontSize = `${8 + Math.random() * 13}px`;
        star.style.animationDelay = `${Math.random() * 3}s`;
        stars.appendChild(star);
    }

    function createParticle(x, y) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.textContent = ["❤️", "✨", "♡", "✦"][Math.floor(Math.random() * 4)];
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        scene.appendChild(particle);

        setTimeout(() => particle.remove(), 1400);
    }

    document.addEventListener("click", (event) => {
        for (let i = 0; i < 8; i++) {
            setTimeout(() => {
                createParticle(
                    event.clientX + (Math.random() - .5) * 90,
                    event.clientY + (Math.random() - .5) * 50
                );
            }, i * 45);
        }
    });
</script>
</body>
</html>
